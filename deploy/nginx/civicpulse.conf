# =============================================================================
# CivicPulse — Nginx Production Reverse Proxy Configuration
#
# Target File Location on Server: /etc/nginx/sites-available/civicpulse.conf
# Enable with:
#   sudo ln -s /etc/nginx/sites-available/civicpulse.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# Upstream ASGI Backend (Gunicorn + Uvicorn Workers)
upstream civicpulse_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# -----------------------------------------------------------------------------
# HTTP Server (Port 80) — Redirect to HTTPS & ACME Challenge
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name civicpulse.example.gov;

    # Let's Encrypt / Certbot Domain Verification Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all non-ACME HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS Server (Port 443) — Production Application
# -----------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name civicpulse.example.gov;

    # --- SSL / TLS Certificates (Managed by Certbot) ---
    ssl_certificate /etc/letsencrypt/live/civicpulse.example.gov/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civicpulse.example.gov/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/civicpulse.example.gov/chain.pem;

    # --- Modern TLS Protocol & Cipher Suite ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Production Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

    # HTTP Strict Transport Security (HSTS):
    # Enforces HTTPS for 1 year including all subdomains.
    # Note: 'preload' is intentionally omitted by default to prevent permanently
    # locking non-HTTPS municipal subdomains into browser preload lists.
    # Add 'preload' only after confirming all subdomains strictly support HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Content Security Policy (CSP):
    # - style-src: allows 'unsafe-inline' for React dynamic styling and https://unpkg.com for Leaflet CSS
    # - img-src: allows self, data URIs, blob previews, OpenStreetMap tiles, and unpkg Leaflet icons
    # - connect-src: 'self' handles same-origin /api/v1 proxying. If using a separate API
    #   subdomain (e.g., https://api.civicpulse.example.gov), append it to connect-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://unpkg.com; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

    # --- Static Frontend Root ---
    root /var/www/civicpulse/frontend/dist;
    index index.html;

    # --- Upload File Size Limit ---
    # Accommodates citizen complaint photo attachments (max 10MB + multipart overhead)
    client_max_body_size 15M;

    # --- Gzip Compression ---
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml;

    # --- Frontend SPA Routing ---
    location / {
        try_files $uri $uri/ /index.html;
    }

    # --- Immutable Static Assets (Vite Fingerprinted Chunks) ---
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        access_log off;
    }

    # --- Backend API Proxy ---
    # Matches /api/v1 and /api/v1/* requests
    location = /api/v1 {
        return 301 /api/v1/;
    }

    location /api/v1/ {
        proxy_pass http://civicpulse_backend;
        proxy_http_version 1.1;

        # Header forwarding for accurate client IP and proto detection
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Keep-Alive connection support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Disable buffering for low-latency API interactions
        proxy_buffering off;
    }

    # --- Health Check Endpoint Proxy (for external uptime monitors / load balancers) ---
    # Proxies /health to FastAPI's mounted /api/v1/health endpoint
    location = /health {
        proxy_pass http://civicpulse_backend/api/v1/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # --- Static Uploads Serving (Protected, Read-Only) ---
    # Block any executable script files uploaded to uploads directory
    location ~* ^/uploads/.*\.(php|pl|py|sh|cgi|exe|bat|js|jsp)$ {
        deny all;
        access_log off;
    }

    location /uploads/ {
        alias /var/www/civicpulse/uploads/;
        autoindex off;
        expires 30d;
        add_header Cache-Control "public, no-transform" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # --- Deny Access to Hidden / Dot Files ---
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
